
name: Construire DOARA MASTER APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle
        run: |
          wget https://services.gradle.org/distributions/gradle-8.9-bin.zip -O /tmp/gradle.zip
          sudo unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Extraire le projet Android
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name '*.zip' -print -quit)
          if [ -z "$ZIP_FILE" ]; then
            echo "ZIP introuvable"
            exit 1
          fi
          mkdir -p android-project
          unzip -q "$ZIP_FILE" -d android-project
              - name: Examiner le code principal
    run: |
          FILE="android-project/doara_android/app/src/main/assets/index.html"
          echo "===== RECHERCHE CLIENTS ET SAUVEGARDE ====="
          grep -nEi 'localStorage|sessionStorage|indexedDB|client|sauveg|storage|backup|function.*save|function.*client' "$FILE" | head -n 180 || true
          echo "===== ACTIVITE ANDROID ====="
          cat android-project/doara_android/app/src/main/java/com/doaramaster/app/MainActivity.java
          echo "===== FICHIER CHECK ====="
          cat android-project/doara_android/check.js
      - name: Preparer le code source complet
        run: |
          cd android-project
          zip -qr ../DOARA-MASTER-SOURCE.zip doara_android

      - name: Envoyer le code source
        uses: actions/upload-artifact@v4
        with:
          name: DOARA-MASTER-SOURCE
          path: DOARA-MASTER-SOURCE.zip

      - name: Afficher le code de DOARA MASTER
        run: |
          echo "===== FICHIER PRINCIPAL ====="
          cat android-project/doara_android/app/src/main/assets/index.html
          echo "===== FICHIER CHECK ====="
          cat android-project/doara_android/check.js

      - name: Configurer le SDK Android
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          if [ -z "$SDKMANAGER" ]; then
            echo "SDKMANAGER introuvable"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Compiler DOARA MASTER
        run: |
          cd android-project/doara_android
          gradle assembleDebug

      - name: Recuperer APK
        uses: actions/upload-artifact@v4
        with:
          name: DOARA-MASTER-APK
          path: android-project/doara_android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
