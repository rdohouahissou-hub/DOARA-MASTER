name: Construire DOARA MASTER APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extraire le projet
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name '*.zip' -print -quit)
          if [ -z "$ZIP_FILE" ]; then
            echo "Aucun fichier ZIP trouve"
            exit 1
          fi
          mkdir -p android-project
          unzip -q "$ZIP_FILE" -d android-project

      - name:       - name: Lire la configuration Android
        run: echo "===== SETTINGS ====="
          cat android-project/doara_android/settings.gradle
          echo "===== BUILD PRINCIPAL ====="
          cat android-project/doara_android/build.gradle
          echo "===== BUILD APPLICATION ====="
          cat android-project/doara_android/app/build.gradle
