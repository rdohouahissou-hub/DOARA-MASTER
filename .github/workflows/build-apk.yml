name: Construire DOARA MASTER APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extraire le projet Android
        run: unzip "DOARA_MASTER_Projet_Android_0_13(1).zip"

      - name: Compiler l'application
        run: cd doara_android && gradle assembleDebug

      - name: Publier le fichier APK
        uses: actions/upload-artifact@v4
        with:
          name: DOARA-MASTER-APK
          path: doara_android/app/build/outputs/apk/debug/app-debug.apk
